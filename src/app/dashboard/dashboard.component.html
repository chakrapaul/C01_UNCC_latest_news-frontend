<app-navbar></app-navbar>

<main class="dashboard-container" role="main" aria-label="Dashboard Content">
  <section class="dashboard-card" aria-labelledby="summary-title">
    <h2 id="summary-title" class="dashboard-title">{{ summary?.title }}</h2>
    <p class="dashboard-content">{{ summary?.content }}</p>
    <p class="dashboard-source">
      <strong>Source:</strong>
      <a [href]="summary?.source" target="_blank" rel="noopener noreferrer">
        {{ summary?.source }}
      </a>
    </p>
  </section>

  <div class="dashboard-divider" role="separator" aria-hidden="true"></div>

  <section class="dashboard-tech" aria-labelledby="tech-title">
    <h3 id="tech-title" class="tech-title">Technical Summary</h3>
    <p class="tech-description">
      This application is built using <strong>Angular</strong> for the frontend,
      <strong>Node.js</strong> with <strong>MySQL</strong> for the backend,
      and <strong>Chart.js</strong> for dynamic data visualizations...
    </p>
  </section>
</main>
